spring.application.name=resume-review
spring.config.import=optional:file:./.openai.properties,optional:file:./.mail.properties,optional:file:./.local.properties
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=13MB
spring.servlet.multipart.file-size-threshold=11MB
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/resume-review}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.h2.console.enabled=false
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
app.admin-email=${ADMIN_EMAIL:}
app.admin-password-hash=${ADMIN_PASSWORD_HASH:}
app.review-email=${REVIEW_EMAIL:review@example.com}
app.public-url=${PUBLIC_URL:http://127.0.0.1:5173}
app.mail-enabled=${MAIL_ENABLED:false}
app.mail-from=${MAIL_FROM:no-reply@example.com}
app.openai-key=${OPENAI_API_KEY:}
app.openai-model=${OPENAI_MODEL:}
app.pdf-font=${PDF_FONT:C:/Windows/Fonts/calibri.ttf}
app.pdf-bold-font=${PDF_BOLD_FONT:C:/Windows/Fonts/calibrib.ttf}
app.aptos-font-directory=${APTOS_FONT_DIRECTORY:.fonts}

app.resend-key=${RESEND_API_KEY:}
app.auth-mail-smtp=${AUTH_MAIL_SMTP:false}
app.auth-mail-from=${AUTH_MAIL_FROM:no-reply@example.com}
