<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PNB Resume Prospective</title><style>
@font-face{font-family:PNBScript;src:url(script.ttf)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{color:#18246b;background:#fff url(watercolor.png) left center/auto 100% no-repeat;font-family:Georgia,serif}button,a{ -webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}#intro,#selection{position:absolute;inset:0;padding:20px;display:flex;align-items:center;justify-content:center}#intro{transition:opacity .18s}#selection{display:none;flex-direction:column;justify-content:space-between;gap:12px}.intro-art{width:min(100%,450px);max-height:88vh;overflow:visible}.script{font-family:PNBScript,cursive;fill:#345e87}.writing{fill:white;stroke:white;stroke-width:95;stroke-linecap:round;stroke-dasharray:460;stroke-dashoffset:460;animation:write 1.05s linear forwards}.writing.two{animation-delay:.95s}.writing.three{animation-delay:1.95s}.robot{opacity:0;animation:appear .28s 3.05s forwards}.hand{transform-origin:295px 840px;animation:wave .5s 3.15s ease-in-out 3 alternate;transform:rotate(100deg)}.wand{fill:#6087bb;opacity:0;animation:wand 3s linear forwards}.intro-line{stroke:#7798c1;stroke-width:1.3;fill:none}
@keyframes write{to{stroke-dashoffset:0}}@keyframes appear{to{opacity:1}}@keyframes wave{to{transform:rotate(133deg)}}@keyframes wand{0%{opacity:1;transform:translate(25px,100px)}32%{transform:translate(405px,100px)}34%{transform:translate(120px,176px)}65%{transform:translate(325px,176px)}67%{transform:translate(5px,245px)}97%{opacity:1;transform:translate(430px,245px)}100%{opacity:0;transform:translate(430px,245px)}}
.top{display:flex;justify-content:space-between;width:100%;gap:14px}.pill{background:linear-gradient(135deg,#fffffff0,#eef5fff0);border:1px solid #bdcdea;border-radius:20px;padding:9px 12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:bold;font-style:italic;box-shadow:0 3px 8px #54749612;min-height:44px}.pill img{height:31px;width:31px;object-fit:contain}.paw{font-style:normal;font-size:24px;color:#6386b2}.brand{text-align:center;margin:10px 0 0;font-size:19.8px}.brand p{font-size:12.1px;color:#8295c4;margin:6px}.brand small{font:10px Arial,sans-serif;color:#687f9f}.choices{width:100%;max-width:440px;text-align:center;margin:auto 0}.choices h1{font-size:clamp(27px,8.2vw,43px);font-weight:normal;line-height:1.1;margin:0 0 16px}.choices p{font:17px Arial,sans-serif;color:#627c9c;margin:0 0 22px}.edition{width:100%;min-height:52px;font-size:clamp(23px,6.8vw,32px);padding:11px 8px;margin:6px 0;border:1px solid #adbee4;border-radius:13px;background:linear-gradient(110deg,#e4ecfb,#f1f6ff)}.edition.coach{background:linear-gradient(110deg,#cedcf3,#d9e4f7);border-color:#95acd6}.edition:focus-visible,.pill:focus-visible{outline:3px solid #345e87;outline-offset:3px}.footer{text-align:center;width:100%;font:12px Arial,sans-serif;color:#6d85a9}.footer p{margin:8px 0}.links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.links a,.footer button{color:#294c88;background:none;border:0;padding:6px 0;font:inherit;text-decoration:none}.support{margin:8px auto 0;min-height:32px;width:fit-content;font:13px Arial,sans-serif;text-decoration:none;color:#294c88}.preview{font:12px Arial,sans-serif;display:none;background:transparent;border:0;color:#5577a3;margin:9px auto}dialog{border:1px solid #bbcae5;border-radius:20px;padding:24px;max-width:90%;color:#243c63;background:#fff;font:16px/1.5 Arial,sans-serif}dialog::backdrop{background:#21375480}dialog h2{font:28px Georgia,serif}dialog button{padding:10px 22px;border:1px solid #bbcae5;border-radius:12px;background:#edf3fc}.hidden{display:none!important}
@media(max-height:600px){#selection{padding:10px 18px;gap:5px}.brand{margin:0;font-size:18px}.choices h1{font-size:26px;margin-bottom:10px}.choices p{margin-bottom:10px}.edition{padding:7px;min-height:44px;font-size:23px}.footer{font-size:10px}.support{margin-top:0}.pill{padding:5px 10px}.brand p{margin:3px}.intro-art{max-height:96vh}.footer p{margin:3px}}
@media(orientation:landscape) and (max-height:600px){#selection{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;column-gap:30px}.top{grid-column:1/-1}.brand{grid-column:1;align-self:center}.choices{grid-column:2;grid-row:2}.footer{grid-column:1/-1}.choices h1{font-size:24px}.edition{font-size:20px;min-height:40px}.footer .support{display:inline-flex;margin-left:15px}.footer .links{display:inline-flex}.footer p{display:inline-block;margin-right:10px}}
@media(prefers-reduced-motion:reduce){.writing{animation:none;stroke-dashoffset:0}.wand{display:none}.robot{animation:none;opacity:1}.hand{animation:none}}
</style></head><body>
<section id="intro" aria-label="Welcome to PNB Resume Prospective">
<svg class="intro-art" viewBox="0 0 440 550" role="img" aria-label="Welcome to PNB Resume Prospective. Our robot waves hello.">
<defs><mask id="write1"><path class="writing" d="M0 80H460"/></mask><mask id="write2"><path class="writing two" d="M0 158H460"/></mask><mask id="write3"><path class="writing three" d="M0 225H460"/></mask>
<clipPath id="arm"><path d="M190 745H380V918H319L320 1160H70V890Z"/></clipPath>
<mask id="body"><rect width="1254" height="1254" fill="white"/><path d="M190 745H380V918H319L320 1160H70V890Z" fill="black"/></mask></defs>
<text x="220" y="102" text-anchor="middle" class="script" font-size="58" mask="url(#write1)">Welcome to</text>
<text x="220" y="182" text-anchor="middle" class="script" font-size="88" mask="url(#write2)">PNB</text>
<text x="220" y="247" text-anchor="middle" class="script" font-size="43" textLength="420" lengthAdjust="spacingAndGlyphs" mask="url(#write3)">Resume Prospective</text>

</svg></section>
<section id="selection" aria-label="Choose your version">
<nav class="top"><button class="pill" onclick="info('about')">About Us <img src="robot.png" alt=""></button><button class="pill" onclick="info('how')">How It Works <img src="paws.png" alt=""></button></nav>
<div class="brand">Resume Prospective<p>Ai Resume Rater &amp; Assistant Builder</p><small>AI assistance powered by OpenAI.</small></div>
<div class="choices"><h1>Welcome to<br>Resume Prospective</h1><p>Are you a:</p><button class="edition coach" onclick="location.href='https://welcome.pnb.invalid/coach'">Coach or Mentor</button><button class="edition" onclick="location.href='https://welcome.pnb.invalid/individual'">Individual</button><button id="preview" class="preview" onclick="location.href='https://welcome.pnb.invalid/preview'">Local sample walkthrough</button></div>
<footer class="footer"><p>A software product by PNB Paws LLC</p><div class="links"><button onclick="info('how')">How It Works</button><a href="https://resumep.pnbpaws.com/faq.html">FAQ</a><a href="https://resumep.pnbpaws.com/privacy.html">Privacy</a><a href="https://resumep.pnbpaws.com/terms.html">Terms</a></div><a class="pill support" href="mailto:resume.prospective@pnbpaws.com">✉ &nbsp; Contact Support</a></footer>
</section><dialog id="info"><h2 id="info-title"></h2><p id="info-copy"></p><button onclick="document.querySelector('dialog').close()">Close</button></dialog>
<script>
const args=new URLSearchParams(location.search);if(args.has('debug'))document.querySelector('#preview').style.display='block';
window.showSelection=()=>{document.querySelector('#intro').classList.add('hidden');document.querySelector('#selection').style.display=matchMedia('(orientation:landscape) and (max-height:600px)').matches?'grid':'flex'};
if(args.has('skip'))showSelection();else setTimeout(showSelection,5000);
function info(which){document.querySelector('#info-title').textContent=which==='about'?'About Resume Prospective':'How It Works';document.querySelector('#info-copy').textContent=which==='about'?'Resume Prospective by PNB Paws LLC helps you review, improve, and tailor your resume with AI assistance. Choose Individual for your own resume or Coach or Mentor to work with others.':'Choose your version and sign in. Upload a resume, receive format and overall feedback, then customize and build it together. You can optionally add a job listing and download your finished resume as PDF or Word.';document.querySelector('dialog').showModal()}
</script></body></html>
